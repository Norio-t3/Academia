<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia FitLife</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="logo">Fit<span>Life</span></div>
        <a href="#matricula" class="btn-topo">Fazer Pré-Matrícula</a>
    </header>

    <!-- Apresentação -->
    <section class="hero">
        <h1>Sua evolução começa na <span>FitLife</span></h1>
        <p>A melhor estrutura da região para você treinar com foco e estilo.</p>
    </section>

    <!-- Formulário Simplificado -->
    <section id="matricula" class="form-container">
        <h2>Pré-Matrícula Online</h2>
        <p>Preencha para garantir o desconto de adesão:</p>

        <form action="https://formspree.io/f/mwlvvvge" method="POST">
            <input type="text" name="nome" placeholder="Seu nome" required>
            <input type="text" name="email" placeholder="Seu e-mail" required>
            <input type="text" name="whatsapp" placeholder="WhatsApp / Telefone" required>
            
            <select name="modalidade" required>
                <option value="" disabled selected>Escolha a modalidade</option>
                <option value="Musculacao">Musculação</option>
                <option value="CrossFit">CrossFit</option>
                <option value="Danca">Aulas de Dança</option>
            </select>

            <button type="submit">Garantir Vaga</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Academia FitLife</p>
    </footer>

</body>
</html>
